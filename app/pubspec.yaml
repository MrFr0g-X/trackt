name: dsai352_cv
description: DSAI 352 Bonus — Offline CV video analyser with glassmorphism UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OpenCV bindings for Dart — full pipeline in pure Dart, no Python needed
  opencv_dart: ^2.0.0

  # File selection
  file_picker: ^8.1.0
  image_picker: ^1.2.2

  # Video playback — media_kit uses libmpv, decodes any codec on Windows + Android
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.7

  # Rich animations
  flutter_animate: ^4.5.2

  # Android runtime permissions
  permission_handler: ^11.3.1

  # Platform output directory (/sdcard/Download on Android, temp on Windows)
  path_provider: ^2.1.4

  # Path utilities
  path: ^1.9.0
  tflite_flutter: ^0.12.1
  camera: ^0.12.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/detect.tflite
    - assets/models/live_detect.tflite
    - assets/models/labelmap.txt

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - video
        - videoio
